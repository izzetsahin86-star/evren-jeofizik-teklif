<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#292825" />
    <meta
      name="description"
      content="Evren Jeofizik teklif, müşteri, saha planlama ve tam serbest profesyonel PDF teklif tasarım stüdyosu"
    />
    <title>Evren Jeofizik Teklif</title>
    <link rel="icon" type="image/svg+xml" href="/assets/evren-jeofizik-logo-embedded.svg" />
    <link rel="apple-touch-icon" href="/assets/evren-jeofizik-logo-embedded.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/live-pdf.css" />
    <link rel="stylesheet" href="/field-professional.css" />
    <link rel="stylesheet" href="/pdf-studio-v2.css" />
    <link rel="stylesheet" href="/professional-suite-v3.css" />
    <link rel="stylesheet" href="/creative-studio-v4.css" />
    <style>
      .ps-studio[data-v4="1"]{grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto!important}
      .ps-studio[data-v4="1"]>.pro-studio-bar{grid-row:1}
      .ps-studio[data-v4="1"]>.ps-toolbar{grid-row:2}
      .ps-studio[data-v4="1"]>.v4-createbar{grid-row:3}
      .ps-studio[data-v4="1"]>.ps-inspector{grid-row:4}
      .ps-studio[data-v4="1"]>.v4-properties{grid-row:5}
      .ps-studio[data-v4="1"]>.ps-canvas{grid-row:6;min-height:0}
      .ps-studio[data-v4="1"]>.pro-measure-strip{grid-row:7}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script src="/app.js" defer></script>
    <script src="/live-pdf.js" defer></script>
    <script src="/field-professional.js" defer></script>
    <script src="/pdf-studio-v2-guard.js" defer></script>
    <script src="/pdf-studio-v2.js" defer></script>
    <script src="/professional-suite-v3-runtime.js" defer></script>
    <script src="/creative-studio-v4.js" defer></script>
  </body>
</html>
